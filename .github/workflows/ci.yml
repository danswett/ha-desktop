name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The repo default points at the Microsoft package proxy, which a hosted runner
  # cannot reach. See build/nuget.ci.config.
  NUGET_CONFIG: build/nuget.ci.config

jobs:
  scripts:
    name: Scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Check scripts and XML
        shell: pwsh
        run: ./tools/Test-Scripts.ps1

  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/HomeAssistant.Desktop/HomeAssistant.Desktop.csproj --configfile '${{ env.NUGET_CONFIG }}'

      - name: Build
        run: dotnet build src/HomeAssistant.Desktop/HomeAssistant.Desktop.csproj -c Release --no-restore

      # Windows App SDK's self-contained output omits this file and no package carries
      # it, so a runner without the framework package installed produces an app whose
      # toasts fail silently. Install it here so the check below is meaningful.
      - name: Install the Windows App Runtime
        shell: pwsh
        run: ./build/Install-WindowsAppRuntime.ps1 -Version 2.5

      - name: Publish
        run: dotnet publish src/HomeAssistant.Desktop/HomeAssistant.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish --configfile '${{ env.NUGET_CONFIG }}'

      - name: Verify the published app is complete
        shell: pwsh
        run: |
          $missing = @()
          foreach ($file in 'HomeAssistant.Desktop.exe',
                            'HomeAssistant.Desktop.pri',
                            'Microsoft.WindowsAppRuntime.Insights.Resource.dll') {
            if (-not (Test-Path "publish/$file")) { $missing += $file }
          }
          if ($missing) {
            throw "The publish output is missing: $($missing -join ', ')"
          }
          Write-Host "Published $((Get-ChildItem publish -Recurse -File).Count) files."
