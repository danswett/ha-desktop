name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The repo default points at the Microsoft package proxy, which a hosted runner
  # cannot reach. See build/nuget.ci.config.
  NUGET_CONFIG: build/nuget.ci.config

jobs:
  scripts:
    name: Scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Check scripts and XML
        shell: pwsh
        run: ./tools/Test-Scripts.ps1

  tests:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Plain net10.0 and no Windows App SDK, so this needs none of the build job's
      # setup and runs in seconds. Restore is separate because dotnet test has no
      # --configfile of its own.
      - name: Restore
        run: dotnet restore tests/HomeAssistant.Desktop.Tests/HomeAssistant.Desktop.Tests.csproj --configfile '${{ env.NUGET_CONFIG }}'

      - name: Test
        run: dotnet test tests/HomeAssistant.Desktop.Tests/HomeAssistant.Desktop.Tests.csproj -c Release --no-restore

  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Before the build, not after: Windows App SDK's self-contained output omits this
      # file and no package carries it, so a runner without the matching framework
      # package produces an app whose toasts fail silently. Runners ship some other
      # version already, so installing the right one is not optional.
      - name: Install the Windows App Runtime
        shell: pwsh
        run: ./build/Install-WindowsAppRuntime.ps1 -Version 2.5

      - name: Restore
        run: dotnet restore src/HomeAssistant.Desktop/HomeAssistant.Desktop.csproj --configfile '${{ env.NUGET_CONFIG }}'

      - name: Build
        run: dotnet build src/HomeAssistant.Desktop/HomeAssistant.Desktop.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish src/HomeAssistant.Desktop/HomeAssistant.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish --configfile '${{ env.NUGET_CONFIG }}' -p:RequireMatchingInsightsResource=true

      - name: Verify the published app is complete
        shell: pwsh
        run: |
          $missing = @()
          foreach ($file in 'HomeAssistant.Desktop.exe',
                            'HomeAssistant.Desktop.pri',
                            'Microsoft.WindowsAppRuntime.Insights.Resource.dll') {
            if (-not (Test-Path "publish/$file")) { $missing += $file }
          }
          if ($missing) {
            throw "The publish output is missing: $($missing -join ', ')"
          }
          Write-Host "Published $((Get-ChildItem publish -Recurse -File).Count) files."
